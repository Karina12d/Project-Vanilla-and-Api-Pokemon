<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI - Nested Data</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light py-5">
<div class="container bg-white p-4 rounded-4 shadow-sm" style="max-width: 600px;">

    <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
        <h1 class="h3 fw-bold text-dark m-0">Pokémon Nested API</h1>
        <div class="d-flex align-items-center gap-2">
            <a href="/" class="btn btn-outline-secondary fw-semibold px-3">Artist Directory</a>
        </div>
    </header>

    <!-- Search Bar with 4-second delay notice -->
    <div class="mb-4">
        <label for="search-input" class="form-label fw-semibold text-muted small">Search Pokémon in real-time (4s delay):</label>
        <input type="text" id="search-input" class="form-control form-control-lg fs-6" placeholder="Type a Pokémon name (e.g., pikachu, charizard)...">
    </div>

    <!-- Loading Indicator -->
    <div id="loading-spinner" class="text-center py-4 d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted small mt-2">Waiting 4 seconds before fetching...</p>
    </div>

    <!-- Result Card Container -->
    <div id="result-container" class="d-none">
        <div class="artist-card p-4 rounded-3 shadow-sm border bg-white">
            <div class="d-flex align-items-center gap-4 mb-3">
                <img id="poke-sprite" src="" alt="Pokémon Sprite" class="rounded-3 bg-light p-2 border" style="width: 90px; height: 90px; object-fit: contain;">
                <div>
                    <h2 id="poke-name" class="h4 fw-bold text-dark text-capitalize m-0"></h2>
                    <span class="badge bg-primary mt-1">3 Endpoints Cascaded</span>
                </div>
            </div>
            <div class="bg-light p-3 rounded-3 small space-y-2 text-secondary">
                <p class="mb-2 d-flex justify-content-between">
                    <span class="fw-semibold">Move (Endpoint 2):</span>
                    <span id="poke-move" class="text-dark fw-bold text-capitalize"></span>
                </p>
                <p class="mb-0 d-flex justify-content-between">
                    <span class="fw-semibold">Type (Endpoint 3):</span>
                    <span id="poke-type" class="text-success fw-bold text-capitalize"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Error Message -->
    <div id="error-container" class="alert alert-danger d-none mt-3 text-center small" role="alert">
        Pokémon not found or connection error.
    </div>

</div>

    <!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- External JS Script -->
<script src="/js/pokemon.js"></script>
</body>
</html>
