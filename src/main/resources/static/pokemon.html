<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Directory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light py-5">
<div class="container bg-white p-4 rounded-4 shadow-sm">

    <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
        <h1 class="h3 fw-bold text-dark m-0">Pokémon Directory</h1>
        <div class="d-flex align-items-center gap-2">
            <a href="/" class="btn btn-warning fw-semibold px-3">Artist Directory</a>
        </div>
    </header>

    <div class="mb-4">
        <input type="text" id="search-input" class="form-control form-control-lg fs-6" placeholder="Search Pokémon by name in real-time (4s delay)...">
    </div>

    <div id="pokemon-grid" class="row g-3"></div>
</div>


<div id="action-modal" class="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 border-0 shadow">
            <div class="modal-header border-0 pb-0 justify-content-between">
                <h2 id="action-pokemon-name" class="h4 fw-bold text-capitalize m-0">Pokémon Details</h2>
                <span id="close-action-modal-btn" class="btn-close" aria-label="Close" style="cursor: pointer;"></span>
            </div>
            <div class="modal-body text-center pt-3">
                <img id="modal-poke-sprite" src="" alt="Sprite" class="bg-light rounded-3 p-2 mb-3 border object-fit-contain shadow-sm" style="width: 100px; height: 100px;">

                <div class="bg-light p-3 rounded-3 text-start small space-y-2">
                    <p class="mb-2 d-flex justify-content-between">
                        <span class="fw-semibold text-muted">Move (Endpoint 2):</span>
                        <span id="modal-poke-move" class="fw-bold text-dark text-capitalize"></span>
                    </p>
                    <p class="mb-0 d-flex justify-content-between">
                        <span class="fw-semibold text-muted">Type (Endpoint 3):</span>
                        <span id="modal-poke-type" class="fw-bold text-success text-capitalize"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/pokemon.js"></script>
</body>
</html>
