<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Universe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light py-5">
<div class="container bg-white p-4 rounded-4 shadow-sm">
    <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
        <h1 class="h3 fw-bold text-dark m-0">Pokemon Universe</h1>
        <a href="/index.html" class="btn btn-secondary px-4">Back to Artists</a>
    </header>


    <ul class="nav nav-pills mb-4" id="pokemon-tabs">
        <li class="nav-item">
            <button class="nav-link active fw-semibold" id="tab-pokemon" onclick="switchEndpoint('pokemon')">1. Pokémon</button>
        </li>
        <li class="nav-item ms-2">
            <button class="nav-link fw-semibold" id="tab-berries" onclick="switchEndpoint('berry')">2. Berries</button>
        </li>
        <li class="nav-item ms-2">
            <button class="nav-link fw-semibold" id="tab-items" onclick="switchEndpoint('item')">3. Items</button>
        </li>
    </ul>


    <div class="mb-2">
        <input type="text" id="search-input" class="form-control form-control-lg fs-6" placeholder="Type to search (wait 4 seconds to query the API)...">
    </div>
    <small id="debounce-status" class="text-muted d-block mb-4 fst-italic" style="min-height: 20px;"></small>


    <div id="artist-grid" class="row g-3">
    </div>
</div>


<div id="action-modal" class="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 text-center border-0 shadow">
            <div class="modal-header border-0 pb-0 justify-content-end">
                <span id="close-action-modal-btn" class="btn-close" aria-label="Close"></span>
            </div>
            <div class="modal-body pt-0" id="modal-body-content"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/pokemon.js"></script>
</body>
</html>
