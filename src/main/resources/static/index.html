<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light py-5">
<div class="container bg-white p-4 rounded-4 shadow-sm">

    <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
        <h1 class="h3 fw-bold text-dark m-0">Artist Directory</h1>
        <div class="d-flex align-items-center gap-2">
            <a href="/pokemon.html" class="btn btn-warning fw-semibold px-3">API Pokemon</a>
            <button id="open-modal-btn" class="btn btn-primary px-4">+ Add New Artist</button>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="mb-4">
        <input type="text" id="search-input" class="form-control form-control-lg fs-6" placeholder="Search artists by name in real-time...">
    </div>

    <div id="artist-grid" class="row g-3">

    </div>
</div>

<!-- Modal for Create / Edit Artist -->
<div id="artist-modal" class="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3 border-0 shadow">
            <div class="modal-header border-0">
                <h2 id="modal-title" class="modal-title h5 fw-bold">Add New Artist</h2>
                <span id="close-modal-btn" class="btn-close" aria-label="Close"></span>
            </div>
            <div class="modal-body">
                <form id="artist-form">
                    <input type="hidden" id="artist-id">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Artist Name:</label>
                        <input type="text" id="name" class="form-control" required placeholder="Enter artist name">
                    </div>
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" id="cancel-btn" class="btn btn-secondary px-3">Cancel</button>
                        <button type="submit" id="submit-btn" class="btn btn-primary px-4">Save Artist</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<div id="action-modal" class="modal">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content p-3 text-center border-0 shadow">
            <div class="modal-header border-0 pb-0 justify-content-end">
                <span id="close-action-modal-btn" class="btn-close" aria-label="Close"></span>
            </div>
            <div class="modal-body pt-0">
                <h2 id="action-artist-name" class="h5 fw-bold mb-2">Artist Details</h2>
                <p class="text-muted small mb-4">Choose an action for this artist:</p>
                <div class="d-grid gap-2">
                    <button id="modal-edit-btn" class="btn btn-warning fw-semibold text-dark">Edit Artist</button>
                    <button id="modal-delete-btn" class="btn btn-danger fw-semibold">Delete Artist</button>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
